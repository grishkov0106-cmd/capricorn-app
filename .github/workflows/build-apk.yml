name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Позволяет запустить сборку вручную

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0' # Стабильная версия
          channel: 'stable'

      - name: Install Flet
        run: pip install flet

      - name: Build APK
        run: |
          cd mobile
          flet build apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: capricorn-app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk